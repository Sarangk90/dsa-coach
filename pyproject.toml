[project]
name = "dsa-coach"
version = "0.1.0"
description = "Adaptive CLI tool for mastering Data Structures, Algorithms, and System Design for Principal Engineer interviews"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sarang Kulkarni" }
]
dependencies = [
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "pygments>=2.0.0",
    "openai>=2.14.0",
    "anthropic>=0.75.0",
    "pydantic-ai>=0.3.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.21.0",
    "claude-agent-sdk>=0.1.19",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]

[project.scripts]
dsa-coach = "dsa_coach.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
# Skip integration tests and harness tests by default (they make real API calls)
addopts = "-m 'not integration' --ignore=tests/harness"
markers = [
    "integration: marks tests as integration tests (require API keys, skipped by default)",
]
asyncio_mode = "auto"

[tool.ruff]
# Set line length to 88 (black's default, matches your COACH_WIDTH)
line-length = 88
target-version = "py311"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "solutions",  # User-generated solution files
    "conversations",  # AI conversation logs
]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize Python code)
    "B",    # flake8-bugbear (find likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (let formatter handle this)
    "B008",   # Do not perform function call in argument defaults (common in FastAPI/Pydantic)
    "ARG001", # Unused function argument (common in CLI commands)
    "ARG002", # Unused method argument
    "N802",   # Function name should be lowercase (for legacy functions)
    "SIM102", # Use a single if statement instead of nested if statements
]

[tool.ruff.lint.per-file-ignores]
# Test files can be more relaxed
"tests/**/*.py" = ["ARG", "PTH"]
# Scripts can use print statements
"scripts/**/*.py" = ["T201"]
# Migration scripts can have complex logic
"**/migrations.py" = ["SIM", "C"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
explicit_package_bases = true

# Allow dynamic typing for now (can tighten gradually)
disallow_any_generics = false
disallow_subclassing_any = false

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = true

# Only block commits on high-priority errors (likely runtime bugs)
# Allow low-priority warnings (type strictness) to pass
disable_error_code = [
    "no-any-return",    # Returning Any from typed functions (common with JSON/dynamic data)
    "union-attr",       # Attribute access on unions (often safe with runtime guards)
    "arg-type",         # Argument type mismatches (often external library quirks)
    "call-overload",    # Call overload mismatches (external API definitions)
    "dict-item",        # Dict literal type mismatches (often safe)
    "return-value",     # Some return value type mismatches
]

# High-priority errors that WILL block commits (likely to cause runtime issues):
# - attr-defined: accessing non-existent attributes
# - call-arg: wrong number/names of function arguments
# - assignment: incompatible type assignments
# - name-defined: using undefined variables
# - operator: unsupported operations
# - comparison-overlap: non-overlapping comparisons (logic bugs)

# Exclude certain directories
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "solutions",
    "conversations",
    "tests/harness",  # Avoid duplicate module detection
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsa-coach"
version = "0.1.0"
description = "Adaptive CLI tool for mastering Data Structures, Algorithms, and System Design for Principal Engineer interviews"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sarang Kulkarni" }
]
dependencies = [
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "pygments>=2.0.0",
    "openai>=2.14.0",
    "anthropic>=0.75.0",
    "pydantic-ai>=0.3.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]

[project.scripts]
dsa-coach = "dsa_coach.main:main"
dsa-coach-menu = "dsa_coach.menu:main"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]

[tool.ruff]
# Set line length to 88 (black's default, matches your COACH_WIDTH)
line-length = 88
target-version = "py311"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "solutions",  # User-generated solution files
    "conversations",  # AI conversation logs
]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize Python code)
    "B",    # flake8-bugbear (find likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (let formatter handle this)
    "B008",   # Do not perform function call in argument defaults (common in FastAPI/Pydantic)
    "ARG001", # Unused function argument (common in CLI commands)
    "ARG002", # Unused method argument
    "N802",   # Function name should be lowercase (for legacy functions)
    "SIM102", # Use a single if statement instead of nested if statements
]

[tool.ruff.lint.per-file-ignores]
# Test files can be more relaxed
"tests/**/*.py" = ["ARG", "PTH"]
# Scripts can use print statements
"scripts/**/*.py" = ["T201"]
# Migration scripts can have complex logic
"**/migrations.py" = ["SIM", "C"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Allow dynamic typing for now (can tighten gradually)
disallow_any_generics = false
disallow_subclassing_any = false

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = true

# Exclude certain directories
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "solutions",
    "conversations",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
